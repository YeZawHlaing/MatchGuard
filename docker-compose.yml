version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: matchguard_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matchguard_db
      MYSQL_USER: matchguard
      MYSQL_PASSWORD: matchguard
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
